          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A9")" -XPATCH -d '{"title":"x","date":"2030-04-01"}' $B/volunteer/schedules/$MS)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A9")" -XDELETE $B/volunteer/schedules/$MS)" = 403
          ALLS=$(curl -fs -H "$VH" $B/volunteer/home | node -pe 'const s=JSON.parse(require("fs").readFileSync(0)).schedules.find(x=>x.title==="전체 일정");if(s.mine||!s.shared)process.exit(1);s.id')
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$VH" -XPATCH -d '{"title":"x","date":"2030-04-01"}' $B/volunteer/schedules/$ALLS)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$VH" -XDELETE $B/volunteer/schedules/$ALLS)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A1")" -XPOST -d '{"title":"x","date":"2030-04-01"}' $B/volunteer/schedules)" = 404
          curl -fs -H "$VH" -XPATCH -d '{"title":"고친 일정","date":"2030-04-02","audience":"all"}' $B/volunteer/schedules/$MS | grep -q '고친 일정'
          if curl -fs -H "$(bearer "$A9")" $B/volunteer/home | grep -q '고친 일정'; then echo "고치면서 전체 공개가 됐어요"; exit 1; fi
          curl -fs -H "$VH" -XDELETE $B/volunteer/schedules/$MS >/dev/null
          # 개인 지정 봉사자를 지워도 일정이 전체 공개로 바뀌지 않음
          curl -fs -H "$H" -XDELETE $B/admin/users/$VB >/dev/null
          if curl -fs -H "$VH" $B/volunteer/home | grep -q '개인 일정'; then echo "지정 봉사자를 지우니 일정이 전체에 보여요"; exit 1; fi
          curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$VS >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/vol-trainings/$VT >/dev/null
          curl -fs -H "$H" -XDELETE $B/projects/$VPJ >/dev/null; curl -fs -H "$H" -XDELETE $B/projects/$HPJ >/dev/null; curl -fs -H "$H" -XDELETE $B/projects/$NPJ >/dev/null
          # 직원 ↔ 봉사자: 바꾸면 바로 적용, 봉사자로 바꾸면 소속·추가 조직이 지워지고 소속 일괄 변경에서도 빠짐
          A8=$(tok vola volunteer-pass-1)
          J="{\"role\":\"member\",\"unitId\":$FB}"; curl -fs -H "$H" -XPATCH -d "$J" $B/admin/users/$VU >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A8")" $B/tasks)" = 200
          J="{\"viewUnits\":[{\"unitId\":$LG,\"sub\":true}]}"; curl -fs -H "$H" -XPATCH -d "$J" $B/admin/users/$VU >/dev/null
          curl -fs -H "$H" -XPATCH -d '{"role":"volunteer"}' $B/admin/users/$VU >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A8")" $B/tasks)" = 403
          curl -fs -H "$(bearer "$A8")" $B/me | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).user;if(u.unitId!==null||u.viewUnits.length)process.exit(1)'
          J="{\"userIds\":[$VU],\"unitId\":$FB}"; curl -fs -H "$H" -XPOST -d "$J" $B/admin/users/unit >/dev/null
          curl -fs -H "$(bearer "$A8")" $B/me | grep -q '"unitId":null'
          curl -fs -H "$H" -XPOST -d '{"userIds":[1],"unitId":3}' $B/admin/users/unit | grep -q '"changed":1'
          curl -fs -H "$H" "$B/units/1?sub=1" | grep -Eq '"memberIds":\[([0-9]+,)*1[],]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -XPOST -d '{"name":"x","url":"http://127.0.0.1/a.ics"}' $B/admin/calendars)" = 400
          curl -fs -H "$H" -XPOST $B/admin/backups | grep -q 'pschedule-'
          test -s /tmp/ps/backups/pschedule-*.db

      - name: 배포 설정 검사
        run: |
          bash -n deploy/setup-vps.sh
          docker compose config -q

      - name: Docker 이미지 빌드
        run: docker build -t pschedule-api .

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: VPS 설정 확인
        id: cfg
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::VPS_HOST 시크릿이 없어 배포를 건너뜁니다. README의 'VPS 배포' 단계를 확인하세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: VPS에 배포
        if: steps.cfg.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/pschedule
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            sleep 3
            docker compose exec -T api wget -qO- http://127.0.0.1:8787/api/health
            echo
            docker compose ps
