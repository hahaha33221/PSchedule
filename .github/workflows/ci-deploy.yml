name: CI / Deploy API to VPS

# 프론트엔드(public/)는 Vercel 에 배포합니다 (README 참고).
# 이 워크플로는 검사 후 API 서버를 VPS에 배포합니다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 비공개 파일이 커밋되지 않았는지 확인
        run: |
          leaked=$(git ls-files | grep -Ei '\.(db|sqlite)$|^private/|^data/|(^|/)\.env$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::비공개 파일이 저장소에 포함되어 있어요: $leaked"
            exit 1
          fi

      - name: 문법 검사
        run: |
          for f in public/app.js server/*.mjs tools/*.mjs; do node --check "$f"; done
          bash -n tools/pull-backups.sh

      - name: iCal 가져오기 검사
        run: node tools/ical-test.mjs

      - name: API 서버 동작 확인
        run: |
          mkdir -p /tmp/ps
          DATA_DIR=/tmp/ps PORT=8787 ADMIN_PASSWORD=ci-pass-1 node --disable-warning=ExperimentalWarning server/index.mjs &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8787/api/health && break; sleep 0.5; done
          B=http://127.0.0.1:8787/api
          curl -fs $B/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/events?from=2026-01-01&to=2026-01-31")" = 401
          T=$(curl -fs -XPOST -H 'content-type: application/json' -d '{"login":"master","password":"ci-pass-1"}' $B/login | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          H="Authorization: Bearer $T"
          curl -fs -H "$H" -XPOST -d '{"title":"테스트","startDate":"2026-01-10"}' $B/events | grep -q '"id":1'
          curl -fs -H "$H" -XPOST -d '{"body":"댓글"}' $B/events/1/comments | grep -q '댓글'
          curl -fs -H "$H" "$B/events?from=2026-01-01&to=2026-01-31" | grep -q '"comments":1'
          curl -fs -H "$H" -XPOST -d '{"title":"준비","meetingId":1,"phase":"before","dueDate":"2026-01-10"}' $B/tasks | grep -q '"phase":"before"'
          curl -fs -H "$H" -XPOST -d '{"body":"메모","date":"2026-01-10","meetingId":1,"important":true}' $B/memos | grep -q '"important":true'
          curl -fs -H "$H" -XPOST -d '{}' $B/memos/1/task | grep -q '"meetingId":1'
          curl -fs -H "$H" "$B/tasks?date=2026-01-10&today=2026-01-10" | grep -q '준비'
          curl -fs -H "$H" -XPOST -d '{"title":"공지","body":"내용"}' $B/notices | grep -q '"id":1'
          curl -fs -H "$H" "$B/search?q=%EB%8C%93%EA%B8%80" | grep -q '"field":"댓글"'
          curl -fs -H "$H" "$B/search?q=%EB%A9%94%20%EB%AA%A8" | grep -q '"type":"memo"'
          curl -fs -H "$H" -XPOST -d '{"login":"member1","name":"멤버"}' $B/admin/users | grep -q '"password"'
          curl -fs -H "$H" "$B/events?from=2026-01-01&to=2026-01-31" | grep -q '"external":\[\]'
          curl -fs -H "$H" -XPOST -d '{"text":"조직위원회 > 운영총괄부 > 식음료팀"}' $B/admin/units/bulk | grep -q '"added":3'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -XPOST -d '{"text":"a > b > c > d > e > f"}' $B/admin/units/bulk)" = 400
          curl -fs -H "$H" -XPOST -d '{"rows":[{"hq":"공통","dept":"위원회 직속","title":"이사장","name":"가나다"},{"hq":"기획본부","dept":"재무부 / 재무관리팀","title":"팀장","name":"라마바"}]}' $B/admin/org/preview | grep -q '"add":\[{'
          curl -fs -H "$H" -XPOST -d '{"rows":[{"hq":"기획본부","dept":"재무부 / 재무관리팀","title":"팀장","name":"라마바"}],"baseDate":"2026-11-01"}' $B/admin/org/apply | grep -q '"added":1'
          curl -fs -H "$H" $B/org | grep -q '"baseDate":"2026-11-01"'
          # 팀별 보이는 범위: 다른 팀은 목록·상세·검색 모두 안 보이고, 참석자로 넣으면 보이고, 상위 조직은 아래 팀을 보고, 관리자는 전부
          curl -fs -H "$H" -XPOST -d '{"text":"조직위원회 > 운영총괄부 > 숙박팀"}' $B/admin/units/bulk >/dev/null
          uid() { curl -fs -H "$H" $B/org | node -e 'const d=JSON.parse(require("fs").readFileSync(0));const u=d.units.find(x=>x.name===process.argv[1]);console.log(u.id)' "$1"; }
          FB=$(uid 식음료팀); LG=$(uid 숙박팀); OP=$(uid 운영총괄부)
          mk() { curl -fs -H "$H" -XPOST -d "{\"login\":\"$1\",\"name\":\"$1\",\"unitId\":$2}" $B/admin/users | node -pe 'JSON.parse(require("fs").readFileSync(0)).password'; }
          tok() { curl -fs -XPOST -H 'content-type: application/json' -d "{\"login\":\"$1\",\"password\":\"$2\"}" $B/login | node -pe 'JSON.parse(require("fs").readFileSync(0)).token'; }
          A1=$(tok usera "$(mk usera $FB)"); A2=$(tok userb "$(mk userb $LG)"); A3=$(tok userc "$(mk userc $OP)"); A4=$(tok usern "$(mk usern null)")
          # 안 읽은 공지 수: 쓴 사람은 0, 다른 사람은 1 → 열어 보면 0
          curl -fs -H "$H" $B/notices/unread | grep -q '"unreadNotices":0'
          curl -fs -H "Authorization: Bearer $A1" $B/me | grep -q '"unreadNotices":1'
          curl -fs -H "Authorization: Bearer $A1" $B/notices | grep -q '"unread":true'
          curl -fs -H "Authorization: Bearer $A1" $B/notices/1 | grep -q '"unreadNotices":0'
          curl -fs -H "Authorization: Bearer $A1" $B/notices/unread | grep -q '"unreadNotices":0'
          ME=$(curl -fs -H "Authorization: Bearer $A2" $B/me | node -pe 'JSON.parse(require("fs").readFileSync(0)).user.id')
          EV=$(curl -fs -H "Authorization: Bearer $A1" -XPOST -d '{"title":"식음료 회의","startDate":"2026-02-03","agenda":["비밀안건"]}' $B/events | node -pe 'JSON.parse(require("fs").readFileSync(0)).event.id')
          TK=$(curl -fs -H "Authorization: Bearer $A1" -XPOST -d '{"title":"식음료 할 일","dueDate":"2026-02-03"}' $B/tasks | node -pe 'JSON.parse(require("fs").readFileSync(0)).task.id')
          S='%EB%B9%84%EB%B0%80%EC%95%88%EA%B1%B4'
          for T in "$A2" "$A4"; do
            curl -fs -H "Authorization: Bearer $T" "$B/events?from=2026-02-01&to=2026-02-28" | grep -vq '식음료 회의'
            test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" $B/events/$EV)" = 404
            test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" $B/tasks/$TK)" = 404
            curl -fs -H "Authorization: Bearer $T" "$B/search?q=$S" | grep -q '"total":0'
          done
          curl -fs -H "Authorization: Bearer $A3" "$B/events?from=2026-02-01&to=2026-02-28" | grep -q '식음료 회의'
          curl -fs -H "Authorization: Bearer $A3" "$B/search?q=$S" | grep -q '"total":1'
          curl -fs -H "$H" "$B/search?q=$S" | grep -q '"total":1'
          curl -fs -H "$H" $B/events/$EV | grep -q '"unitId":'"$FB"
          curl -fs -H "Authorization: Bearer $A1" -XPATCH -d "{\"attendeeIds\":[$ME]}" $B/events/$EV >/dev/null
          curl -fs -H "Authorization: Bearer $A2" $B/events/$EV | grep -q '비밀안건'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $A2" -XPATCH -d "{\"unitId\":$LG}" $B/events/$EV)" = 403
          # 추가로 볼 수 있는 조직: 숙박팀 사람(userb)에게 식음료팀을 추가하면 보이고, 빼면 다시 안 보임
          UB=$(curl -fs -H "$H" $B/admin/users | node -pe 'JSON.parse(require("fs").readFileSync(0)).users.find(u=>u.login==="userb").id')
          GRANT="{\"viewUnits\":[{\"unitId\":$FB,\"sub\":true}]}"
          curl -fs -H "$H" -XPATCH -d "$GRANT" $B/admin/users/$UB | grep -q '"viewUnits":\[{'
          curl -fs -H "Authorization: Bearer $A2" "$B/tasks" | grep -q '식음료 할 일'
          curl -fs -H "Authorization: Bearer $A2" $B/me | grep -q "\"unitId\":$FB"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $A2" -XPATCH -d "$GRANT" $B/admin/users/$UB)" = 403
          curl -fs -H "$H" -XPATCH -d '{"viewUnits":[]}' $B/admin/users/$UB >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $A2" $B/tasks/$TK)" = 404
          # 외부 참석자: 넣기·검색·다른 팀(못 보는 사람)은 못 넣음
          curl -fs -H "Authorization: Bearer $A1" -XPOST -d '{"name":"외부손님","org":"서울교구","contact":"010-0000-0000"}' $B/events/$EV/guests | grep -q '외부손님'
          curl -fs -H "Authorization: Bearer $A1" $B/events/$EV | grep -q '"guests":\[{'
          curl -fs -H "Authorization: Bearer $A1" "$B/search?q=%EC%84%9C%EC%9A%B8%EA%B5%90%EA%B5%AC" | grep -q '"field":"외부 참석자"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $A4" -XPOST -d '{"name":"x"}' $B/events/$EV/guests)" = 404
          # 구글 캘린더 일정 → 우리 소속으로 넣기: 넣기, 같은 팀 중복 막기, 볼 수 없는 팀 막기, 원본 바뀜 알림·맞추기
          SQL() { node --disable-warning=ExperimentalWarning -e 'const {DatabaseSync}=require("node:sqlite");const db=new DatabaseSync(process.argv[1]);const r=db.prepare(process.argv[2]).run();console.log(Number(r.lastInsertRowid))' /tmp/ps/pschedule.db "$1"; }
          CAL=$(SQL "INSERT INTO calendars (name, url) VALUES ('WYD', 'https://example.com/x.ics')")
          XID=$(SQL "INSERT INTO calendar_events (calendar_id, uid, inst, title, start_date, end_date, start_time, end_time, location) VALUES ($CAL, 'u1@test', 'T1', 'WYD 전체 회의', '2026-02-10', '2026-02-10', '10:00', '11:00', '본관')")
          curl -fs -H "Authorization: Bearer $A1" -XPOST -d "{\"ids\":[$XID]}" $B/external/import | grep -q '"created":\[{'
          curl -fs -H "Authorization: Bearer $A1" -XPOST -d "{\"ids\":[$XID]}" $B/external/import | grep -q '"created":\[\],"skipped":\[{'
          TOLG="{\"ids\":[$XID],\"unitId\":$LG}"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $A1" -XPOST -d "$TOLG" $B/external/import)" = 403
          curl -fs -H "$H" -XPOST -d "$TOLG" $B/external/import | grep -q '"created":\[{'
          curl -fs -H "Authorization: Bearer $A1" $B/external/$XID | grep -q "\"unitId\":$FB"
          IM=$(curl -fs -H "Authorization: Bearer $A1" $B/external/$XID | node -pe 'JSON.parse(require("fs").readFileSync(0)).event.imported[0].eventId')
          curl -fs -H "Authorization: Bearer $A1" $B/events/$IM | grep -q '"status":"same"'
          SQL "UPDATE calendar_events SET start_time = '14:00', end_time = '15:00' WHERE id = $XID" >/dev/null
          curl -fs -H "Authorization: Bearer $A1" $B/events/$IM | grep -q '"status":"changed"'
          curl -fs -H "Authorization: Bearer $A1" -XPOST $B/events/$IM/source-sync | grep -q '"startTime":"14:00"'
          curl -fs -H "Authorization: Bearer $A2" "$B/events?from=2026-02-01&to=2026-02-28" | grep -q 'WYD 전체 회의'
          # 넣은 원본은 그 우리 일정이 보이는 사람에게는 숨김 (목록·검색), 우리 일정에는 원본 캘린더 이름
          EXT() { curl -fs -H "Authorization: Bearer $1" "$B/events?from=2026-02-01&to=2026-02-28" | node -pe 'const d=JSON.parse(require("fs").readFileSync(0)); d.external.length + "/" + d.events.filter(e=>e.sourceName==="WYD").length'; }
          test "$(EXT "$A1")" = "0/1"
          test "$(EXT "$A4")" = "1/0"
          curl -fs -H "Authorization: Bearer $A1" "$B/search?q=WYD" | grep -q '"sourceName":"WYD"'
          # 같은 원본을 두 팀이 넣으면 관리자에게는 서로 '다른 팀에도 있어요' 로 이어지고, 둘 다 sourceKey 가 같음
          curl -fs -H "$H" $B/events/$IM | grep -q '"sameSource":\[{'
          test "$(curl -fs -H "$H" "$B/events?from=2026-02-01&to=2026-02-28" | node -pe 'const d=JSON.parse(require("fs").readFileSync(0)); new Set(d.events.filter(e=>e.sourceKey).map(e=>e.sourceKey)).size + "/" + d.events.filter(e=>e.sourceKey).length')" = "1/2"
          curl -fs -H "Authorization: Bearer $A1" "$B/search?q=WYD" | grep -vq '"type":"ext"'
          # 연락처: 로그인한 사람 모두 조직도 전체(공석 포함)를 봄, 남의 것 수정 403 (번호는 가짜)
          curl -fs -H "$H" -XPOST -d '{"text":"조직위원회 > 운영총괄부 > 운영총괄팀\n조직위원회 > 재무부 > 기부후원팀"}' $B/admin/units/bulk >/dev/null
          if curl -fs -H "$H" $B/org | grep -q 'contactsPrivate'; then echo "비공개 설정이 남아 있어요"; exit 1; fi
          OPS=$(uid 운영총괄팀); GIV=$(uid 기부후원팀)
          A5=$(tok opsa "$(mk opsa $OPS)"); A6=$(tok giva "$(mk giva $GIV)")
          bearer() { echo "Authorization: Bearer $1"; }
          myref() { curl -fs -H "$(bearer "$1")" $B/contacts | node -pe 'JSON.parse(require("fs").readFileSync(0)).me.ref'; }
          setc() { J="{\"mobile\":\"$3\"}"; curl -fs -H "$(bearer "$1")" -XPUT -d "$J" $B/contacts/$2 >/dev/null; }
          setc "$A5" "$(myref "$A5")" 010-0000-0005; setc "$A6" "$(myref "$A6")" 010-0000-0006; setc "$A1" "$(myref "$A1")" 010-0000-0001
          # 계정 없는 자리는 관리자가 입력, 겸직은 자리마다 같은 값
          addpos() { J="{\"unitId\":$1,\"title\":\"직원\",\"name\":\"$2\"}"; curl -fs -H "$H" -XPOST -d "$J" $B/admin/org/positions | node -pe 'JSON.parse(require("fs").readFileSync(0)).id'; }
          PO=$(addpos $OPS 운영자리); PG=$(addpos $FB 일반자리); addpos $LG 일반자리 >/dev/null
          curl -fs -H "$H" -XPUT -d '{"mobile":"010-0000-0007"}' $B/contacts/p$PO >/dev/null
          curl -fs -H "$H" -XPUT -d '{"email":"seat@example.com","office":"02-000-0008"}' $B/contacts/p$PG >/dev/null
          test "$(curl -fs -H "$H" $B/contacts | grep -o '02-000-0008' | wc -l | tr -d ' ')" = 2
          see() { curl -fs -H "$(bearer "$1")" $B/contacts | grep -q "$2"; }
          nosee() { if curl -fs -H "$(bearer "$1")" $B/contacts | grep -q "$2"; then echo "연락처가 새요: $2"; exit 1; fi; }
          for who in "$A1" "$A3" "$A4" "$A5" "$A6"; do for n in 010-0000-0001 010-0000-0005 010-0000-0006 010-0000-0007 02-000-0008; do see "$who" "$n"; done; done
          # 공석 자리는 번호 없이 줄만 나오고, 고칠 수 없음
          J="{\"unitId\":$GIV,\"title\":\"빈자리\"}"; PV=$(curl -fs -H "$H" -XPOST -d "$J" $B/admin/org/positions | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          curl -fs -H "$(bearer "$A1")" $B/contacts | node -e 'const r=JSON.parse(require("fs").readFileSync(0)).rows.find(x=>x.vacant&&x.title==="빈자리");if(!r||r.mobile||r.office||r.email||r.ref)process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -XPUT -d '{"mobile":"1"}' $B/contacts/p$PV)" = 404
          for n in 0005 0006 0007 0001; do curl -fs -H "$H" $B/contacts | grep -q "010-0000-$n"; done
          UA=$(curl -fs -H "$H" $B/admin/users | node -e 'const d=JSON.parse(require("fs").readFileSync(0));console.log((d.users||d).find(u=>u.login==="usera").id)')
          # 본부장: 맡은 조직과 그 아래의 회의를 봄, 관리 기능·남의 연락처 수정은 안 됨
          USR() { curl -fs -H "$H" $B/admin/users | node -e 'const d=JSON.parse(require("fs").readFileSync(0));console.log((d.users||d).find(u=>u.login===process.argv[1]).id)' "$1"; }
          UC=$(USR userc); UN=$(USR usern)
          FIN=$(curl -fs -H "$H" $B/org | node -e 'const d=JSON.parse(require("fs").readFileSync(0));console.log(d.units.find(u=>u.name==="기부후원팀").parentId)')
          curl -fs -H "$H" -XPATCH -d '{"role":"director"}' $B/admin/users/$UC >/dev/null
          curl -fs -H "$(bearer "$A3")" $B/me | grep -q '"role":"director"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A3")" $B/admin/users)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A3")" -XPUT -d '{"mobile":"1"}' $B/contacts/u$UA)" = 403
          curl -fs -H "$H" -XPATCH -d '{"role":"member"}' $B/admin/users/$UC >/dev/null
          # 소속이 없어도 조직도 자리를 연결하면 그 조직 아래를 봄
          EV=$(curl -fs -H "$(bearer "$A6")" -XPOST -d '{"title":"후원 회의","startDate":"2026-02-02"}' $B/events | node -pe 'JSON.parse(require("fs").readFileSync(0)).event.id')
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A4")" $B/events/$EV)" = 404
          J="{\"unitId\":$FIN,\"title\":\"부장\",\"name\":\"usern\",\"userId\":$UN}"; PD=$(curl -fs -H "$H" -XPOST -d "$J" $B/admin/org/positions | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          curl -fs -H "$H" -XPATCH -d '{"role":"director"}' $B/admin/users/$UN >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A4")" $B/events/$EV)" = 200
          curl -fs -H "$H" -XPATCH -d '{"role":"member"}' $B/admin/users/$UN >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/org/positions/$PD >/dev/null
          # 외부 연락처·카테고리: 관리자만 입력, 로그인한 사람은 모두 봄, 카테고리를 지워도 연락처는 남음
          CATS=$(curl -fs -H "$H" -XPOST -d '{"name":"협력 업체"}' $B/admin/contact-categories)
          CAT=$(echo "$CATS" | node -pe 'JSON.parse(require("fs").readFileSync(0)).categories[0].id')
          J="{\"name\":\"외부사람\",\"org\":\"가나회사\",\"categoryId\":$CAT,\"mobile\":\"010-0000-0011\"}"
          curl -fs -H "$H" -XPOST -d "$J" $B/admin/external-contacts >/dev/null
          see "$A1" 010-0000-0011; see "$A5" 010-0000-0011; see "$A6" 010-0000-0011
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A1")" -XPOST -d "$J" $B/admin/external-contacts)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A1")" -XPUT -d '{"mobile":"1"}' $B/contacts/e1)" = 404
          curl -fs -H "$H" -XDELETE $B/admin/contact-categories/$CAT | grep -q '"categoryId":null'
          # 일괄 입력: 동명이인은 구역으로 나누고, 이미 있는 값은 유지, 못 찾으면 안 넣음, 번호는 출력 안 함
          addpos $FB 김동명 >/dev/null; addpos $LG 김동명 >/dev/null
