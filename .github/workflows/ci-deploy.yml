          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -XPATCH -d '{"progress":"x"}' $B/admin/vol-edu/$RE)" = 400
          curl -fs -H "$H" -XPATCH -d '{"helpers":[],"sendThread":40,"progress":"planned"}' $B/admin/vol-edu/$RE | JQ 'if(d.row.helpers.length||d.row.mismatch.length||d.row.progress!=="planned")process.exit(1)'
          curl -fs -H "$H" -XDELETE $B/admin/vol-roster/$GR | JQ 'if(d.roster.length!==1)process.exit(1)'
          for S in $(curl -fs -H "$H" $B/admin/vol-schedules | JQ 'console.log(d.schedules.filter(s=>/시험수도회|새수도회/.test(s.title)||(s.title==="봉사자 모임"&&s.date==="2030-08-03")).map(s=>s.id).join(" "))'); do curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$S >/dev/null; done
          curl -fs -H "$H" -XDELETE $B/admin/vol-roster/$(curl -fs -H "$H" $B/admin/vol-roster | JQ 'console.log(d.roster[0].id)') >/dev/null
          curl -fs -H "$H" -XPUT -d '{"staffOn":false}' $B/ops/perms >/dev/null
          curl -fs -H "$H" -XDELETE $B/stock/$SLI >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$SH1" $B/ops/monasteries)" = 403
          curl -fs -H "$H" -XPATCH -d '{"role":"volunteer","volKinds":["dept"],"volLeader":true}' $B/admin/users/$(USR volb) >/dev/null
          curl -fs -H "$H" $B/admin/users | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).users.find(x=>x.login==="volb");if(!u||u.volLeader)process.exit(1)'
          TI=$(curl -fs -H "$TH" -XPOST -d '{"kind":"thread","scheduleId":'$TO',"title":"실 끊어짐"}' $B/team/issues | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPATCH -d '{"status":"done"}' $B/team/issues/$TI)" = 403
          curl -fs -H "$H" -XPATCH -d '{"status":"doing","reply":"확인 중"}' $B/team/issues/$TI | node -e 'const x=JSON.parse(require("fs").readFileSync(0)).issues.find(i=>i.id==='$TI');if(x.status!=="doing"||x.reply!=="확인 중")process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XDELETE $B/team/issues/$TI)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPOST -d '{"title":"x"}' $B/team/docs)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -XPOST -d '{"title":"x","url":"http://a"}' $B/team/docs)" = 400
          curl -fs -H "$H" -XPOST -d '{"category":"inspect","title":"검수 기준","url":"https://example.com/a"}' $B/team/docs >/dev/null
          curl -fs -H "$TH" $B/team/docs | grep -q '검수 기준'
          SH=$(curl -fs -H "$TH" -XPOST -d '{"date":"2030-06-02","need":2}' $B/team/shifts | node -pe 'JSON.parse(require("fs").readFileSync(0)).shifts.find(s=>s.date==="2030-06-02").id')
          curl -fs -H "$TH" -XPOST -d '{"on":true}' $B/team/shifts/$SH/signup | node -e 'const s=JSON.parse(require("fs").readFileSync(0)).shifts.find(x=>x.id==='$SH');if(!s.mine||s.people[0]!=="팀봉사")process.exit(1)'
          curl -fs -H "$TH" -XPOST -d '{"date":"2030-06-02","qty":40}' $B/team/daily | node -e 'if(JSON.parse(require("fs").readFileSync(0)).daily[0].qty!==40)process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPUT -d '{"date":"2030-06-07","on":true}' $B/team/avail)" = 400
          curl -fs -H "$TH" -XPUT -d '{"date":"2030-06-01","on":true}' $B/team/avail | node -e 'const d=JSON.parse(require("fs").readFileSync(0));if(d.mine[0]!=="2030-06-01"||d.counts["2030-06-01"]!==1||d.people["2030-06-01"].join()!=="봉사"||!d.eduDays.includes("2030-06-01"))process.exit(1)'
          # 봉사자 권한 겹치기(부서·팀): 둘 다 로그인 가능, 세션마다 한쪽 권한만, 메뉴에서 바꿈, 없는 권한으로는 못 바꿈. 관리자는 겹치지 않음
          BPW=$(curl -fs -H "$H" -XPOST -d '{"login":"bothv","name":"겸직봉사","role":"volunteer","volKinds":["dept","team"]}' $B/admin/users | node -pe 'JSON.parse(require("fs").readFileSync(0)).password')
          curl -fs -H "$H" $B/admin/users | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).users.find(x=>x.login==="bothv");if(u.volKinds.join()!=="dept,team")process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -XPOST -d '{"login":"nonev","name":"x","role":"volunteer","volKinds":[]}' $B/admin/users)" = 400
          BD=$(curl -fs -XPOST -H 'content-type: application/json' -d "{\"login\":\"bothv\",\"password\":\"$BPW\",\"as\":\"volunteer\"}" $B/login | node -pe 'const d=JSON.parse(require("fs").readFileSync(0));if(d.user.volKind!=="dept"||d.user.volKinds.length!==2)process.exit(1);d.token')
          BT=$(curl -fs -XPOST -H 'content-type: application/json' -d "{\"login\":\"bothv\",\"password\":\"$BPW\",\"as\":\"team\"}" $B/login | node -pe 'const d=JSON.parse(require("fs").readFileSync(0));if(d.user.volKind!=="team")process.exit(1);d.token')
          J="{\"login\":\"bothv\",\"password\":\"$BPW\",\"as\":\"staff\"}"; test "$(curl -s -o /dev/null -w '%{http_code}' -XPOST -H 'content-type: application/json' -d "$J" $B/login)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$BD")" $B/team/home)" = 403
          curl -fs -H "$(bearer "$BD")" $B/volunteer/home >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$BT")" $B/volunteer/home)" = 403
          curl -fs -H "$(bearer "$BT")" $B/team/orgs | grep -q '연락처 칸'
          curl -fs -H "$(bearer "$BD")" -XPOST -d '{"mode":"team"}' $B/vol-mode | node -e 'if(JSON.parse(require("fs").readFileSync(0)).user.volKind!=="team")process.exit(1)'
          curl -fs -H "$(bearer "$BD")" $B/team/home >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$BD")" $B/volunteer/home)" = 403
          curl -fs -H "$(bearer "$BD")" $B/me | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).user;if(u.volKind!=="team"||u.role!=="volunteer")process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPOST -d '{"mode":"dept"}' $B/vol-mode)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$VH" -XPOST -d '{"mode":"team"}' $B/vol-mode)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPOST -d '{"mode":"x"}' $B/vol-mode)" = 403
          # 겹친 계정도 남의 비밀글은 못 보고 직원 데이터는 막힘, 부서 쪽에서는 연락처(팀 API)도 막힘
          BX=$(curl -fs -H "$VH" -XPOST -d '{"category":"request","title":"남의 비밀","body":"숨긴 내용","secret":true}' $B/board | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          for TK in "$BD" "$BT"; do
            curl -fs -H "$(bearer "$TK")" $B/board/$BX | node -e 'const d=JSON.parse(require("fs").readFileSync(0));if(d.post.body||d.post.canSee)process.exit(1)'
            test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$TK")" $B/contacts)" = 403
            test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$TK")" $B/admin/users)" = 403
          done
          curl -fs -H "$(bearer "$BD")" -XPOST -d '{"mode":"dept"}' $B/vol-mode >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$BD")" $B/team/orgs)" = 403
          # 예전 화면처럼 volKinds 없이 고쳐도 겹친 권한은 그대로, 관리자로 바꾸면 봉사자 권한은 없어짐
          curl -fs -H "$H" -XPATCH -d '{"name":"겸직봉사","role":"volunteer"}' $B/admin/users/$(USR bothv) >/dev/null
          curl -fs -H "$H" $B/admin/users | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).users.find(x=>x.login==="bothv");if(u.volKinds.join()!=="dept,team")process.exit(1)'
          curl -fs -H "$H" -XPATCH -d '{"role":"admin","volKinds":["dept","team"]}' $B/admin/users/$(USR bothv) >/dev/null
          curl -fs -H "$H" $B/admin/users | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).users.find(x=>x.login==="bothv");if(u.role!=="admin"||u.volKinds.length)process.exit(1)'
          curl -fs -H "$(bearer "$BT")" $B/me | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).user;if(u.role!=="admin"||u.volKind!==null||u.volKinds.length)process.exit(1)'
          curl -fs -H "$H" -XDELETE $B/board/$BX >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/users/$(USR bothv) >/dev/null
          # 알림(웹 푸시): 암호화가 RFC 8291 예시와 같고, 구독은 알려진 푸시 서비스 주소만, 봉사자도 구독함, 로그아웃 전에 지움
          node --input-type=module -e 'import { encryptPayload } from "./server/push.mjs"; const o = encryptPayload("When I grow up, I want to be a watermelon", "BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcxaOzi6-AYWXvTBHm4bjyPjs7Vd8pZGH6SRpkNtoIAiw4", "BTBZMqHH6r4Tts7J_aSIgg", { salt: "DGv6ra1nlYgDCS1FRnbzlw", asPrivate: "yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw" }).toString("base64url"); if (o !== "DGv6ra1nlYgDCS1FRnbzlwAAEABBBP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A_yl95bQpu6cVPTpK4Mqgkf1CXztLVBSt2Ks3oZwbuwXPXLWyouBWLVWGNWQexSgSxsj_Qulcy4a-fN") process.exit(1)'
          curl -fs -H "$TH" $B/push/key | node -e 'const k=JSON.parse(require("fs").readFileSync(0)).key;if(Buffer.from(k,"base64url").length!==65)process.exit(1)'
          PK=BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcxaOzi6-AYWXvTBHm4bjyPjs7Vd8pZGH6SRpkNtoIAiw4
          J="{\"endpoint\":\"https://evil.example.com/x\",\"keys\":{\"p256dh\":\"$PK\",\"auth\":\"BTBZMqHH6r4Tts7J_aSIgg\"}}"; test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPOST -d "$J" $B/push/subscribe)" = 400
          J="{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/ci-test\",\"keys\":{\"p256dh\":\"x\",\"auth\":\"y\"}}"; test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPOST -d "$J" $B/push/subscribe)" = 400
          J="{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/ci-test\",\"keys\":{\"p256dh\":\"$PK\",\"auth\":\"BTBZMqHH6r4Tts7J_aSIgg\"}}"; curl -fs -H "$TH" -XPOST -d "$J" $B/push/subscribe | grep -q '"ok":true'
          curl -fs -H "$VH" -XPOST -d "$J" $B/push/subscribe | grep -q '"ok":true'
          J="{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/ci-test\"}"; curl -fs -H "$VH" -XPOST -d "$J" $B/push/unsubscribe | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$VH" -XPOST $B/push/test)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/push/key)" = 401
          # 기기 알림 보고: 로그인 없이 받지만 등록된 구독 주소만 기록, 늘 204
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -XPOST -d '{"endpoint":"https://fcm.googleapis.com/fcm/send/none","stage":"shown"}' $B/push/report)" = 204
          # 알림 종류별 설정: 팀 봉사자는 교육·필요 인원·이슈 답까지, 직원 관리자는 새 이슈. 모르는 종류는 버림
          curl -fs -H "$TH" $B/push/prefs | node -e 'const d=JSON.parse(require("fs").readFileSync(0));if(!d.kinds.includes("edu")||!d.kinds.includes("issue_reply")||d.off.length)process.exit(1)'
          curl -fs -H "$TH" -XPUT -d '{"off":["edu","need","zzz"]}' $B/push/prefs | node -e 'const d=JSON.parse(require("fs").readFileSync(0));if(d.off.join()!=="edu,need")process.exit(1)'
          curl -fs -H "$TH" $B/push/prefs | grep -q '"off":\["edu","need"\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPUT -d '{"off":"edu"}' $B/push/prefs)" = 400
          curl -fs -H "$TH" -XPUT -d '{"off":[]}' $B/push/prefs | grep -q '"off":\[\]'
          curl -fs -H "$H" $B/push/prefs | grep -q '"issue_new"'
          curl -fs -H "$H" -XDELETE $B/admin/users/$(USR teamv) >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$TV >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$RV >/dev/null; curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$NV >/dev/null
          # 개인 지정 봉사자를 지워도 일정이 전체 공개로 바뀌지 않음
          curl -fs -H "$H" -XDELETE $B/admin/users/$VB >/dev/null
          if curl -fs -H "$VH" $B/volunteer/home | grep -q '개인 일정'; then echo "지정 봉사자를 지우니 일정이 전체에 보여요"; exit 1; fi
          curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$VS >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/vol-trainings/$VT >/dev/null
          curl -fs -H "$H" -XDELETE $B/projects/$VPJ >/dev/null; curl -fs -H "$H" -XDELETE $B/projects/$HPJ >/dev/null; curl -fs -H "$H" -XDELETE $B/projects/$NPJ >/dev/null
          # 직원 ↔ 봉사자: 바꾸면 바로 적용, 봉사자로 바꾸면 소속·추가 조직이 지워지고 소속 일괄 변경에서도 빠짐
          A8=$(tok vola volunteer-pass-1)
          J="{\"role\":\"member\",\"unitId\":$FB}"; curl -fs -H "$H" -XPATCH -d "$J" $B/admin/users/$VU >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A8")" $B/tasks)" = 200
          J="{\"viewUnits\":[{\"unitId\":$LG,\"sub\":true}]}"; curl -fs -H "$H" -XPATCH -d "$J" $B/admin/users/$VU >/dev/null
          curl -fs -H "$H" -XPATCH -d '{"role":"volunteer"}' $B/admin/users/$VU >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A8")" $B/tasks)" = 403
          curl -fs -H "$(bearer "$A8")" $B/me | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).user;if(u.unitId!==null||u.viewUnits.length)process.exit(1)'
          J="{\"userIds\":[$VU],\"unitId\":$FB}"; curl -fs -H "$H" -XPOST -d "$J" $B/admin/users/unit >/dev/null
          curl -fs -H "$(bearer "$A8")" $B/me | grep -q '"unitId":null'
          curl -fs -H "$H" -XPOST -d '{"userIds":[1],"unitId":3}' $B/admin/users/unit | grep -q '"changed":1'
          curl -fs -H "$H" "$B/units/1?sub=1" | grep -Eq '"memberIds":\[([0-9]+,)*1[],]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -XPOST -d '{"name":"x","url":"http://127.0.0.1/a.ics"}' $B/admin/calendars)" = 400
          curl -fs -H "$H" -XPOST $B/admin/backups | grep -q 'pschedule-'
          test -s /tmp/ps/backups/pschedule-*.db

      - name: 배포 설정 검사
        run: |
          bash -n deploy/setup-vps.sh
          docker compose config -q

      - name: Docker 이미지 빌드
        run: docker build -t pschedule-api .

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: VPS 설정 확인
        id: cfg
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::VPS_HOST 시크릿이 없어 배포를 건너뜁니다. README의 'VPS 배포' 단계를 확인하세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: VPS에 배포
        if: steps.cfg.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/pschedule
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            sleep 3
            docker compose exec -T api wget -qO- http://127.0.0.1:8787/api/health
            echo
            docker compose ps
