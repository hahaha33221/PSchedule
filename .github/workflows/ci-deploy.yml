          curl -fs -H "$H" $B/admin/users | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).users.find(x=>x.login==="bothv");if(u.volKinds.join()!=="dept,team")process.exit(1)'
          curl -fs -H "$H" -XPATCH -d '{"role":"admin","volKinds":["dept","team"]}' $B/admin/users/$(USR bothv) >/dev/null
          curl -fs -H "$H" $B/admin/users | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).users.find(x=>x.login==="bothv");if(u.role!=="admin"||u.volKinds.length)process.exit(1)'
          curl -fs -H "$(bearer "$BT")" $B/me | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).user;if(u.role!=="admin"||u.volKind!==null||u.volKinds.length)process.exit(1)'
          curl -fs -H "$H" -XDELETE $B/board/$BX >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/users/$(USR bothv) >/dev/null
          # 알림(웹 푸시): 암호화가 RFC 8291 예시와 같고, 구독은 알려진 푸시 서비스 주소만, 봉사자도 구독함, 로그아웃 전에 지움
          node --input-type=module -e 'import { encryptPayload } from "./server/push.mjs"; const o = encryptPayload("When I grow up, I want to be a watermelon", "BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcxaOzi6-AYWXvTBHm4bjyPjs7Vd8pZGH6SRpkNtoIAiw4", "BTBZMqHH6r4Tts7J_aSIgg", { salt: "DGv6ra1nlYgDCS1FRnbzlw", asPrivate: "yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw" }).toString("base64url"); if (o !== "DGv6ra1nlYgDCS1FRnbzlwAAEABBBP4z9KsN6nGRTbVYI_c7VJSPQTBtkgcy27mlmlMoZIIgDll6e3vCYLocInmYWAmS6TlzAC8wEqKK6PBru3jl7A_yl95bQpu6cVPTpK4Mqgkf1CXztLVBSt2Ks3oZwbuwXPXLWyouBWLVWGNWQexSgSxsj_Qulcy4a-fN") process.exit(1)'
          curl -fs -H "$TH" $B/push/key | node -e 'const k=JSON.parse(require("fs").readFileSync(0)).key;if(Buffer.from(k,"base64url").length!==65)process.exit(1)'
          PK=BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcxaOzi6-AYWXvTBHm4bjyPjs7Vd8pZGH6SRpkNtoIAiw4
          J="{\"endpoint\":\"https://evil.example.com/x\",\"keys\":{\"p256dh\":\"$PK\",\"auth\":\"BTBZMqHH6r4Tts7J_aSIgg\"}}"; test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPOST -d "$J" $B/push/subscribe)" = 400
          J="{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/ci-test\",\"keys\":{\"p256dh\":\"x\",\"auth\":\"y\"}}"; test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPOST -d "$J" $B/push/subscribe)" = 400
          J="{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/ci-test\",\"keys\":{\"p256dh\":\"$PK\",\"auth\":\"BTBZMqHH6r4Tts7J_aSIgg\"}}"; curl -fs -H "$TH" -XPOST -d "$J" $B/push/subscribe | grep -q '"ok":true'
          curl -fs -H "$VH" -XPOST -d "$J" $B/push/subscribe | grep -q '"ok":true'
          J="{\"endpoint\":\"https://fcm.googleapis.com/fcm/send/ci-test\"}"; curl -fs -H "$VH" -XPOST -d "$J" $B/push/unsubscribe | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$VH" -XPOST $B/push/test)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/push/key)" = 401
          # 기기 알림 보고: 로그인 없이 받지만 등록된 구독 주소만 기록, 늘 204
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -XPOST -d '{"endpoint":"https://fcm.googleapis.com/fcm/send/none","stage":"shown"}' $B/push/report)" = 204
          # 알림 종류별 설정: 팀 봉사자는 교육·필요 인원·이슈 답까지, 직원 관리자는 새 이슈. 모르는 종류는 버림
          curl -fs -H "$TH" $B/push/prefs | node -e 'const d=JSON.parse(require("fs").readFileSync(0));if(!d.kinds.includes("edu")||!d.kinds.includes("issue_reply")||d.off.length)process.exit(1)'
          curl -fs -H "$TH" -XPUT -d '{"off":["edu","need","zzz"]}' $B/push/prefs | node -e 'const d=JSON.parse(require("fs").readFileSync(0));if(d.off.join()!=="edu,need")process.exit(1)'
          curl -fs -H "$TH" $B/push/prefs | grep -q '"off":\["edu","need"\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$TH" -XPUT -d '{"off":"edu"}' $B/push/prefs)" = 400
          curl -fs -H "$TH" -XPUT -d '{"off":[]}' $B/push/prefs | grep -q '"off":\[\]'
          curl -fs -H "$H" $B/push/prefs | grep -q '"issue_new"'
          for X in "$H" "$TH" "$VH"; do curl -fs -H "$X" $B/push/prefs | JQ 'if(!d.kinds.includes("followup"))process.exit(1)'; done
          curl -fs -H "$VH" -XPUT -d '{"off":["followup"]}' $B/push/prefs | JQ 'if(d.off.join()!=="followup")process.exit(1)'
          curl -fs -H "$VH" -XPUT -d '{"off":[]}' $B/push/prefs | JQ 'if(d.off.length)process.exit(1)'
          curl -fs -H "$(bearer "$A1")" $B/push/prefs | JQ 'if(d.kinds.join()!=="notice")process.exit(1)'
          curl -fs -H "$H" -XPUT -d '{"staffOn":true}' $B/ops/perms >/dev/null
          curl -fs -H "$(bearer "$A1")" $B/push/prefs | JQ 'if(d.kinds.join()!=="notice,followup")process.exit(1)'
          curl -fs -H "$H" -XPUT -d '{"staffOn":false}' $B/ops/perms >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/users/$(USR teamv) >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$TV >/dev/null
          test "$(CODE -H "$H" -XDELETE $B/admin/vol-schedules/$RV)" = 400; curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$NV >/dev/null
          # 개인 지정 봉사자를 지워도 일정이 전체 공개로 바뀌지 않음
          curl -fs -H "$H" -XDELETE $B/admin/users/$VB >/dev/null
          if curl -fs -H "$VH" $B/volunteer/home | grep -q '개인 일정'; then echo "지정 봉사자를 지우니 일정이 전체에 보여요"; exit 1; fi
          curl -fs -H "$H" -XDELETE $B/admin/vol-schedules/$VS >/dev/null
          curl -fs -H "$H" -XDELETE $B/admin/vol-trainings/$VT >/dev/null
          curl -fs -H "$H" -XDELETE $B/projects/$VPJ >/dev/null; curl -fs -H "$H" -XDELETE $B/projects/$HPJ >/dev/null; curl -fs -H "$H" -XDELETE $B/projects/$NPJ >/dev/null
          # 직원 ↔ 봉사자: 바꾸면 바로 적용, 봉사자로 바꾸면 소속·추가 조직이 지워지고 소속 일괄 변경에서도 빠짐
          A8=$(tok vola volunteer-pass-1)
          J="{\"role\":\"member\",\"unitId\":$FB}"; curl -fs -H "$H" -XPATCH -d "$J" $B/admin/users/$VU >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A8")" $B/tasks)" = 200
          J="{\"viewUnits\":[{\"unitId\":$LG,\"sub\":true}]}"; curl -fs -H "$H" -XPATCH -d "$J" $B/admin/users/$VU >/dev/null
          curl -fs -H "$H" -XPATCH -d '{"role":"volunteer"}' $B/admin/users/$VU >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$(bearer "$A8")" $B/tasks)" = 403
          curl -fs -H "$(bearer "$A8")" $B/me | node -e 'const u=JSON.parse(require("fs").readFileSync(0)).user;if(u.unitId!==null||u.viewUnits.length)process.exit(1)'
          J="{\"userIds\":[$VU],\"unitId\":$FB}"; curl -fs -H "$H" -XPOST -d "$J" $B/admin/users/unit >/dev/null
          curl -fs -H "$(bearer "$A8")" $B/me | grep -q '"unitId":null'
          curl -fs -H "$H" -XPOST -d '{"userIds":[1],"unitId":3}' $B/admin/users/unit | grep -q '"changed":1'
          curl -fs -H "$H" "$B/units/1?sub=1" | grep -Eq '"memberIds":\[([0-9]+,)*1[],]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$H" -XPOST -d '{"name":"x","url":"http://127.0.0.1/a.ics"}' $B/admin/calendars)" = 400
          curl -fs -H "$H" -XPOST $B/admin/backups | grep -q 'pschedule-'
          test -s /tmp/ps/backups/pschedule-*.db

      - name: 배포 설정 검사
        run: |
          bash -n deploy/setup-vps.sh
          docker compose config -q

      - name: Docker 이미지 빌드
        run: docker build -t pschedule-api .

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: VPS 설정 확인
        id: cfg
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::VPS_HOST 시크릿이 없어 배포를 건너뜁니다. README의 'VPS 배포' 단계를 확인하세요."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: VPS에 배포
        if: steps.cfg.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/pschedule
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            sleep 3
            docker compose exec -T api wget -qO- http://127.0.0.1:8787/api/health
            echo
            docker compose ps
