<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)" />
  <title>P-Schedule</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <!-- 앱 설치(홈 화면·안드로이드 앱) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="P-Schedule" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" aria-live="polite"><div class="loading loading--full" role="status"><div class="loading__inner"><img class="loading__logo" src="favicon.svg" alt="" /><span class="loading__text">불러오는 중…</span></div></div></div>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title">
    <div class="dialog__head">
      <h2 id="dialog-title"></h2>
      <button class="icon-btn" type="button" aria-label="닫기" data-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <div class="dialog__body" id="dialog-body"></div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="rooms.js"></script>
  <script src="vol-accounts.js"></script>
  <script src="app.js"></script>
</body>
</html>
